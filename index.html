<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Diary</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="viewport">
    <!-- Previous (older) -->
    <button class="nav nav--prev" id="prevBtn" aria-label="Previous entry">&#10094;</button>

    <div class="book" id="book">
      <!-- Left page: date + activity timeline -->
      <section class="page page--left">
        <header class="page-header page-header--left">
          <h1 class="date" id="date">—</h1>
          <a class="view-link" href="stats.html" aria-label="Open stats view">Stats →</a>
        </header>
        <ul class="activity" id="activity"></ul>
      </section>

      <div class="book-spine" aria-hidden="true"></div>

      <!-- Right page: top = highlights + PERMA, bottom = condition + Eudaimon -->
      <section class="page page--right">
        <!-- Top region (~2/3): two columns -->
        <div class="right-top">
          <!-- Left column: highlights -->
          <div class="rt-col rt-col--highlights">
            <header class="page-header page-header--right">
              <span class="page-label">Highlights</span>
            </header>
            <ul class="highlights" id="highlights"></ul>
          </div>

          <!-- Right column: PERMA radar (daily self-rating, 0–4) -->
          <div class="rt-col rt-col--perma">
            <header class="page-header page-header--right">
              <span class="page-label">PERMA</span>
              <span class="perma-scale-note">0–4</span>
            </header>
            <div class="perma" id="perma"></div>
          </div>
        </div>

        <!-- Bottom region (~1/3): condition + Eudaimon breakdown -->
        <div class="right-bottom">
          <div class="condition-row condition-row--right">
            <span class="condition-label">Condition</span>
            <span class="condition-value" id="condition"></span>
          </div>

          <div class="eudaimon">
            <div class="eu-head">
              <span class="eu-title">Eudaimon</span>
              <button class="info-btn" id="infoBtn" aria-label="Show Eudaimon formula" title="Eudaimon formula">i</button>
              <span class="eu-score" id="euScore">—</span>
            </div>
            <div class="eu-bars" id="euTerms"></div>
          </div>
        </div>
      </section>
    </div>

    <!-- Next (newer) -->
    <button class="nav nav--next" id="nextBtn" aria-label="Next entry">&#10095;</button>
  </main>

  <!-- Formula modal (content injected from model.formulaText()) -->
  <div class="modal-overlay" id="formulaModal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-label="Eudaimon formula">
      <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      <h2 class="modal-title" id="modalTitle">Eudaimon formula</h2>
      <pre class="formula" id="formulaBody"></pre>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
